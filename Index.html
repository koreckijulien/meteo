<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Météo pluie">
<style>
:root{--bg:#e9eff3;--ink:#12263a;--mute:#5d7184;--bar:#1b5fa8;--dry:#b7c6d3;--card:#f7fafc;--temp:#d4561f;--tmin:#1f8a8a;--cloud:#a9b9c8;--cloud2:#7a8ea1;--moon:#7d8fa3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#0e1a26;--ink:#e6eef5;--mute:#8da2b5;--bar:#5aa7f0;--dry:#2b3e50;--card:#142333;--temp:#ff9a62;--tmin:#5fd0c9;--cloud:#8da2b5;--cloud2:#62788c;--moon:#d5deea}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Avenir Next","Segoe UI",system-ui,sans-serif;min-height:100vh}
main{max-width:560px;margin:0 auto;padding:20px 16px 32px}
h1{font-size:1.5rem;margin:0 0 4px;letter-spacing:-.01em}
#place{color:var(--mute);margin:0 0 16px;min-height:1.3em}
form{display:flex;gap:8px;margin-bottom:8px}
input{flex:1;min-width:0;padding:12px;border-radius:10px;border:1px solid var(--dry);background:var(--card);color:var(--ink);font-size:1rem}
button{padding:12px 14px;border-radius:10px;border:0;background:var(--bar);color:#fff;font-size:1rem;cursor:pointer}
button.alt{background:transparent;color:var(--bar);border:1px solid var(--bar);width:100%;margin-bottom:16px}
:focus-visible{outline:3px solid var(--bar);outline-offset:2px}
.tabs{display:flex;gap:4px;background:var(--dry);padding:4px;border-radius:12px;margin-bottom:12px}
.tabs button{flex:1;background:transparent;color:var(--ink);padding:10px;font-weight:600}
.tabs button[aria-selected="true"]{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.card{background:var(--card);border-radius:14px;padding:16px 10px 10px}
#sum{font-size:1.1rem;margin:0 4px 4px}
h2{font-size:1.15rem;margin:24px 0 10px}
#sum7{font-size:1.1rem;margin:0 4px 4px}
#sum7b{color:var(--mute);margin:0 4px 10px;font-size:.95rem}
.map{padding:10px}
#radar{width:100%;height:420px;border:0;border-radius:10px;display:block;background:var(--dry)}
#radarlink{margin:8px 4px 0;font-size:.9rem}
#radarlink a{color:var(--bar)}
#sum2{color:var(--mute);margin:0 4px 10px;font-size:.95rem}
svg{width:100%;height:auto;display:block}
.ax{fill:var(--mute);font-size:10px}
.axb{fill:var(--bar);font-size:10px}
.axt{fill:var(--temp);font-size:10px}
.axm{fill:var(--tmin);font-size:10px}
.leg{display:flex;flex-wrap:wrap;gap:6px 16px;margin:6px 4px 0;font-size:.85rem;color:var(--mute)}
.leg i{display:inline-block;vertical-align:middle;margin-right:6px}
#msg{color:var(--mute);margin:12px 4px 0;font-size:.9rem}
</style>
</head>
<body>
<main>
<h1>Pluie et température</h1>
<p id="place"></p>
<form id="f"><input id="q" type="search" placeholder="Ville (ex. Lyon)" aria-label="Ville" autocomplete="off"><button type="submit">Chercher</button></form>
<button class="alt" id="geo" type="button">Utiliser ma position</button>
<div class="card">
<p id="sum">Chargement…</p>
<p id="sum2"></p>
<svg id="chart" viewBox="0 0 360 230" role="img" aria-label="Graphique pluie et température"></svg>
<div class="leg" id="leg"></div>
</div>
<h2>Les 7 prochains jours</h2>
<div class="card">
<p id="sum7"></p>
<p id="sum7b"></p>
<svg id="chart7" viewBox="0 0 360 230" role="img" aria-label="Pluie cumulée par jour et températures minimale et maximale"></svg>
<div class="leg" id="leg7"></div>
</div>
<h2>Radar de pluie</h2>
<div class="card map">
<iframe id="radar" title="Carte radar des précipitations" loading="lazy" allowfullscreen></iframe>
<p id="radarlink"></p>
</div>
<p id="msg">Données Open-Meteo, heure locale du lieu. Les icônes montrent le ciel prévu selon la couverture nuageuse : soleil, éclaircies, nuages, couvert, pluie (et lune la nuit). Les pourcentages indiquent la probabilité de pluie.</p>
</main>
<script>
const $=id=>document.getElementById(id);
const NS="http://www.w3.org/2000/svg";
let DATA=null;
function save(o){try{localStorage.setItem("meteo-pluie",JSON.stringify(o))}catch(e){}}
function load(){try{return JSON.parse(localStorage.getItem("meteo-pluie"))}catch(e){return null}}
const r1=v=>Math.round(v*10)/10;

function radar(loc){
  const la=(+loc.lat).toFixed(3),lo=(+loc.lon).toFixed(3);
  $("radar").src=`https://embed.windy.com/embed.html?type=map&location=coordinates&metricRain=mm%2Fh&metricTemp=%C2%B0C&metricWind=km%2Fh&zoom=8&overlay=radar&product=radar&level=surface&lat=${la}&lon=${lo}&detailLat=${la}&detailLon=${lo}&marker=true&message=true`;
  $("radarlink").innerHTML=`<a href="https://www.windy.com/${la}/${lo}?radar,${la},${lo},8" target="_blank" rel="noopener">Ouvrir le radar en plein écran</a>`;
}

async function show(loc){
  radar(loc);
  $("place").textContent=loc.name||"Ma position";
  $("sum").textContent="Chargement…";$("sum2").textContent="";$("sum7").textContent="";$("sum7b").textContent="";
  try{
    const u=`https://api.open-meteo.com/v1/forecast?latitude=${loc.lat}&longitude=${loc.lon}&hourly=precipitation,temperature_2m,cloud_cover,is_day,precipitation_probability&daily=precipitation_sum,temperature_2m_max,temperature_2m_min,precipitation_probability_max&forecast_days=7&timezone=auto`;
    const r=await fetch(u);
    if(!r.ok)throw new Error();
    const d=await r.json();
    const key=new Date(Date.now()+d.utc_offset_seconds*1000).toISOString().slice(0,13);
    let i=d.hourly.time.findIndex(t=>t.slice(0,13)>=key);
    if(i<0)i=0;
    DATA={
      h:{t:d.hourly.time.slice(i,i+24),p:d.hourly.precipitation.slice(i,i+24),c:d.hourly.temperature_2m.slice(i,i+24),cl:d.hourly.cloud_cover.slice(i,i+24),dy:d.hourly.is_day.slice(i,i+24),pr:d.hourly.precipitation_probability.slice(i,i+24)},
      d:{t:d.daily.time,p:d.daily.precipitation_sum,max:d.daily.temperature_2m_max,min:d.daily.temperature_2m_min,pr:d.daily.precipitation_probability_max,cl:d.daily.time.map(day=>{
        const idx=[];d.hourly.time.forEach((t,q)=>{if(t.startsWith(day))idx.push(q)});
        const jour=idx.filter(q=>d.hourly.is_day[q]===1),use=jour.length?jour:idx;
        return use.length?use.reduce((a,q)=>a+(d.hourly.cloud_cover[q]||0),0)/use.length:50;
      })}
    };
    render();save(loc);
  }catch(e){
    DATA=null;
    $("sum").textContent="Impossible de charger les prévisions. Vérifiez votre connexion et réessayez.";
    $("chart").innerHTML="";$("chart7").innerHTML="";$("leg").innerHTML="";$("leg7").innerHTML="";
  }
}

function setup(id){
  const svg=$(id);svg.innerHTML="";
  return {svg,el:(nm,a,t)=>{const e=document.createElementNS(NS,nm);for(const k in a)e.setAttribute(k,a[k]);if(t!=null)e.textContent=t;svg.appendChild(e);return e}};
}
function leg(id,items){$(id).innerHTML=items.map(([s,l])=>`<span><i style="${s}"></i>${l}</span>`).join("");}
const BAR="width:12px;height:12px;border:1px solid var(--bar);border-radius:2px;background:linear-gradient(to top,var(--bar) 60%,transparent 60%)";


const SUN='<circle cx="12" cy="12" r="5.2" style="fill:#f2a900"/><path d="M20 12h2.5M17.7 17.7l1.7 1.7M12 20v2.5M6.3 17.7l-1.7 1.7M4 12H1.5M6.3 6.3L4.6 4.6M12 4V1.5M17.7 6.3l1.7-1.7" style="stroke:#f2a900;stroke-width:1.8;stroke-linecap:round;fill:none"/>';
const MOON='<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" style="fill:var(--moon)"/>';
const CP='M7 18h10a4 4 0 0 0 .5-7.97A6 6 0 0 0 6 11.5 3.3 3.3 0 0 0 7 18z';
const cloud=(tr,f)=>`<path transform="${tr}" d="${CP}" style="fill:var(${f})"/>`;
const SKY={
 "sun":["Ensoleillé",SUN],
 "moon":["Nuit dégagée",MOON],
 "sun-cloud-s":["Peu nuageux",`<g transform="scale(.8)">${SUN}</g>`+cloud("translate(9,10) scale(.6)","--cloud")],
 "moon-cloud-s":["Nuit peu nuageuse",`<g transform="scale(.85)">${MOON}</g>`+cloud("translate(9,10) scale(.6)","--cloud")],
 "sun-cloud":["Éclaircies",`<g transform="translate(1,0) scale(.65)">${SUN}</g>`+cloud("translate(3,5) scale(.85)","--cloud")],
 "moon-cloud":["Nuit avec nuages",`<g transform="scale(.7)">${MOON}</g>`+cloud("translate(3,5) scale(.85)","--cloud")],
 "cloud":["Nuageux",cloud("translate(-2,-1) scale(1.15)","--cloud")],
 "overcast":["Couvert",cloud("translate(6,-1) scale(.8)","--cloud")+cloud("translate(-2,1) scale(1.1)","--cloud2")],
 "rain":["Pluie",cloud("translate(-1,-3) scale(1.05)","--cloud2")+'<path d="M8 18.5l-1 3M12.5 18.5l-1 3M17 18.5l-1 3" style="stroke:var(--bar);stroke-width:1.8;stroke-linecap:round;fill:none"/>']
};
function skyKind(cl,day,rain){
  if(rain)return "rain";
  if(cl<15)return day?"sun":"moon";
  if(cl<40)return day?"sun-cloud-s":"moon-cloud-s";
  if(cl<70)return day?"sun-cloud":"moon-cloud";
  if(cl<90)return "cloud";
  return "overcast";
}
function icon(el,kind,x,y,size){
  const g=el("g",{transform:`translate(${x.toFixed(1)},${y}) scale(${size/24})`});
  g.innerHTML=`<title>${SKY[kind][0]}</title>`+SKY[kind][1];
}

function bar(el,x,w,base,full,v,pr,rx){
  const p=pr==null?(v>0?100:0):pr;
  if(v<=0&&p<10){el("rect",{x,y:base-1.5,width:w,height:1.5,rx,fill:"var(--dry)"});return}
  const h=Math.max(4,full);
  el("rect",{x:x+.5,y:base-h+.5,width:w-1,height:h-1,rx,fill:"var(--bar)","fill-opacity":.15,stroke:"var(--bar)","stroke-width":1});
  const f=h*Math.min(1,p/100);
  if(f>.5)el("rect",{x,y:base-f,width:w,height:f,rx,fill:"var(--bar)"});
}

function render(){
  if(!DATA)return;
  draw24();draw7();
}

function draw24(){
  const {t:times,p:vals,c:temps,cl,dy,pr}=DATA.h;
  const {el}=setup("chart");
  const W=360,H=230,L=28,R=28,T=38,B=26;
  const pmax=Math.max(2,Math.ceil(Math.max(...vals)));
  let tmin=Math.floor(Math.min(...temps))-1,tmax=Math.ceil(Math.max(...temps))+1;
  if(tmax-tmin<4){tmax+=2;tmin-=2}
  const n=vals.length,cw=(W-L-R)/n,ch=H-B-T;
  const yt=v=>T+ch-((v-tmin)/(tmax-tmin))*ch;
  [0,.5,1].forEach(f=>{
    const y=T+ch-f*ch;
    el("line",{x1:L,x2:W-R,y1:y,y2:y,stroke:"var(--dry)","stroke-width":.7});
    el("text",{x:L-4,y:y+3,"text-anchor":"end",class:"axb"},r1(f*pmax)+"");
    el("text",{x:W-R+4,y:y+3,class:"axt"},Math.round(tmin+f*(tmax-tmin))+"°");
  });
  vals.forEach((v,k)=>{
    const x=L+k*cw+cw*.12,w=cw*.76;
    bar(el,x,w,T+ch,(v/pmax)*ch,v,pr[k],1.5);
    if(k%3===0)el("text",{x:x+w/2,y:H-9,"text-anchor":"middle",class:"ax"},times[k].slice(11,13)+"h");
  });
  for(let k=0;k<n;k+=3){
    let c=0,pp=0,dd=0,m=0,pm=0;
    for(let q=k;q<Math.min(k+3,n);q++){c+=cl[q];pp+=vals[q];dd+=dy[q];m++;if(pr[q]!=null)pm=Math.max(pm,pr[q])}
    icon(el,skyKind(c/m,dd/m>=.5,pp>=0.3),L+k*cw+cw/2-10,4,20);
    if(pm>=10)el("text",{x:L+k*cw+cw/2,y:35,"text-anchor":"middle",class:"axb"},pm+"%");
  }
  el("polyline",{points:temps.map((v,k)=>`${(L+k*cw+cw/2).toFixed(1)},${yt(v).toFixed(1)}`).join(" "),fill:"none",stroke:"var(--temp)","stroke-width":2.4,"stroke-linejoin":"round","stroke-linecap":"round"});
  const ti=temps.indexOf(Math.max(...temps)),tl=temps.indexOf(Math.min(...temps));
  [[ti,-7],[tl,13]].forEach(([k,dy])=>el("text",{x:L+k*cw+cw/2,y:yt(temps[k])+dy,"text-anchor":"middle",class:"axt",style:"font-weight:600"},Math.round(temps[k])+"°"));
  const tot=vals.reduce((a,b)=>a+b,0);
  if(tot<0.1)$("sum").textContent="Pas de pluie prévue dans les 24 h.";
  else{const pk=vals.indexOf(Math.max(...vals));$("sum").textContent=`${tot.toFixed(1)} mm au total, pic vers ${times[pk].slice(11,13)}h (${vals[pk].toFixed(1)} mm/h).`;}
  $("sum2").textContent=`Température : de ${Math.round(Math.min(...temps))}° à ${Math.round(Math.max(...temps))}°. Probabilité de pluie maximale : ${Math.max(0,...pr.map(x=>x||0))} %.`;
  leg("leg",[[BAR,"Pluie : hauteur = mm/h, remplissage = probabilité"],["width:16px;height:3px;background:var(--temp);border-radius:2px","Température (°C)"]]);
}

function draw7(){
  const {t:days,p:vals,max:tmaxs,min:tmins,cl,pr}=DATA.d;
  const {el}=setup("chart7");
  const W=360,H=230,L=28,R=28,T=42,B=30;
  const pmax=Math.max(5,Math.ceil(Math.max(...vals)));
  let lo=Math.floor(Math.min(...tmins))-1,hi=Math.ceil(Math.max(...tmaxs))+1;
  if(hi-lo<6){hi+=3;lo-=3}
  const n=vals.length,cw=(W-L-R)/n,ch=H-B-T;
  const yt=v=>T+ch-((v-lo)/(hi-lo))*ch;
  [0,.5,1].forEach(f=>{
    const y=T+ch-f*ch;
    el("line",{x1:L,x2:W-R,y1:y,y2:y,stroke:"var(--dry)","stroke-width":.7});
    el("text",{x:L-4,y:y+3,"text-anchor":"end",class:"axb"},r1(f*pmax)+"");
    el("text",{x:W-R+4,y:y+3,class:"axt"},Math.round(lo+f*(hi-lo))+"°");
  });
  vals.forEach((v,k)=>{
    const x=L+k*cw+cw*.2,w=cw*.6;
    const h=v>0?Math.max(4,(v/pmax)*ch):0;
    bar(el,x,w,T+ch,(v/pmax)*ch,v,pr[k],2);
    if(v>0)el("text",{x:x+w/2,y:T+ch-h-3,"text-anchor":"middle",class:"axb",style:"font-weight:600"},r1(v)+"");
    const dt=new Date(days[k]+"T12:00:00");
    el("text",{x:x+w/2,y:H-14,"text-anchor":"middle",class:"ax"},dt.toLocaleDateString("fr-FR",{weekday:"short"}).replace(".",""));
    el("text",{x:x+w/2,y:H-3,"text-anchor":"middle",class:"ax"},dt.getDate()+"");
    icon(el,skyKind(cl[k],true,v>=1),x+w/2-12,6,24);
    if(pr[k]!=null&&pr[k]>=10)el("text",{x:x+w/2,y:39,"text-anchor":"middle",class:"axb"},pr[k]+"%");
  });
  const line=(arr,c,dash)=>el("polyline",{points:arr.map((v,k)=>`${(L+k*cw+cw/2).toFixed(1)},${yt(v).toFixed(1)}`).join(" "),fill:"none",stroke:c,"stroke-width":2.4,"stroke-linejoin":"round","stroke-linecap":"round"});
  line(tmaxs,"var(--temp)");line(tmins,"var(--tmin)");
  tmaxs.forEach((v,k)=>{
    const x=L+k*cw+cw/2;
    el("circle",{cx:x,cy:yt(v),r:3,fill:"var(--temp)"});
    el("text",{x,y:yt(v)-7,"text-anchor":"middle",class:"axt",style:"font-weight:600"},Math.round(v)+"°");
    el("circle",{cx:x,cy:yt(tmins[k]),r:3,fill:"var(--tmin)"});
    el("text",{x,y:yt(tmins[k])+14,"text-anchor":"middle",class:"axm",style:"font-weight:600"},Math.round(tmins[k])+"°");
  });
  const tot=vals.reduce((a,b)=>a+b,0);
  if(tot<0.1)$("sum7").textContent="Pas de pluie prévue cette semaine.";
  else{
    const pk=vals.indexOf(Math.max(...vals));
    const jour=new Date(days[pk]+"T12:00:00").toLocaleDateString("fr-FR",{weekday:"long"});
    $("sum7").textContent=`${tot.toFixed(1)} mm sur 7 jours, jour le plus arrosé : ${jour} (${vals[pk].toFixed(1)} mm).`;
  }
  $("sum7b").textContent=`Minimales de ${Math.round(Math.min(...tmins))}° à ${Math.round(Math.max(...tmins))}°, maximales de ${Math.round(Math.min(...tmaxs))}° à ${Math.round(Math.max(...tmaxs))}°.`;
  leg("leg7",[[BAR,"Pluie : hauteur = mm/jour, remplissage = probabilité maximale"],["width:16px;height:3px;background:var(--temp);border-radius:2px","Température max"],["width:16px;height:3px;background:var(--tmin);border-radius:2px","Température min"]]);
}

$("f").addEventListener("submit",async e=>{
  e.preventDefault();
  const q=$("q").value.trim();if(!q)return;
  $("sum").textContent="Recherche…";
  try{
    const r=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=1&language=fr`);
    const d=await r.json();
    if(!d.results||!d.results.length){$("sum").textContent="Ville introuvable. Vérifiez l'orthographe.";return}
    const c=d.results[0];
    show({name:c.name+(c.admin1?", "+c.admin1:""),lat:c.latitude,lon:c.longitude});
  }catch(err){$("sum").textContent="Recherche impossible. Réessayez."}
});

async function ipLoc(){
  for(const u of ["https://ipwho.is/","https://ipapi.co/json/"]){
    try{
      const d=await (await fetch(u)).json();
      if(d.success!==false&&d.latitude!=null&&d.longitude!=null)
        return {name:"Position approximative"+(d.city?" ("+d.city+")":""),lat:d.latitude,lon:d.longitude};
    }catch(e){}
  }
  return null;
}
async function fallback(why){
  $("sum").textContent="Position précise indisponible, recherche approximative…";
  const l=await ipLoc();
  if(l)show(l);else $("sum").textContent=why+" Saisissez une ville ci-dessus.";
}
function geo(){
  if(!navigator.geolocation)return fallback("Position indisponible.");
  $("sum").textContent="Localisation…";
  navigator.geolocation.getCurrentPosition(
    p=>show({name:"Ma position",lat:p.coords.latitude,lon:p.coords.longitude}),
    err=>fallback(err&&err.code===1?"Accès à la position refusé.":"Position introuvable."),
    {timeout:10000}
  );
}
$("geo").addEventListener("click",geo);

const s=load();
if(s)show(s);else geo();
</script>
</body>
</html>
